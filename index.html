<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
        body {
            background-image: url('https://i.pinimg.com/736x/39/8d/73/398d732701eb854945885d25dc426d3c.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: rgb(66, 43, 2);
            padding-bottom: 40px;
        }

        #asd {
            background-color: rgb(255, 163, 50);
            height: 475px;
            width: 400px;
            margin-top: 39px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        button {
            width: 40%;
            padding: 10px;
            background-color: #c8842c !important;
            border: none !important;
            border-radius: 10px;
            margin-top: 10px;
            font-weight: bold;
            color: white !important;
        }

        button:hover {
            background-color: #b07224 !important;
        }

        input {
            width: 50%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        
    </style>
   
</head>
<body>
    <center>
    <div class="container" style="max-width: 600px;" id="asd">
    <h1>Non-metal Information</h1>
    <p> Enter a Non-metal code to search</p>

    <input type="text" id="nonmetal1" placeholder="Example: He">

    <br>
    <button py-click="search_nonmetal"> Search Non-metal </button>
    <div class="result"></div> 
        <h3> Search Result</h3>

            <p><b>Element Name:</b> <span id="name">-</span></p>
            <p><b>Atomic Number:</b> <span id="number">-</span></p>
            <p><b>Atomic Mass:</b> <span id="mass">-</span></p>
    </div>

    <script type="py" src="main.py"></script>
    </div>
</body>
</html>
